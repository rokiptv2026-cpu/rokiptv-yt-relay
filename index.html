<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>RokIPTV YouTube Relay</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#000}
    #player,iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (function(){
      var p=new URLSearchParams(location.search),v=p.get('v')||'';
      if(!v){document.body.innerHTML='<p style="color:#fff;text-align:center;margin-top:40vh;font-family:sans-serif">Nessun video</p>';return}
      var s=document.createElement('script');
      s.src='https://www.youtube.com/iframe_api';
      s.onerror=fallback;
      document.head.appendChild(s);
      var t=setTimeout(function(){if(!window.YT||!window.YT.Player)fallback()},4000);
      window.onYouTubeIframeAPIReady=function(){
        clearTimeout(t);
        new YT.Player('player',{
          width:'100%',height:'100%',videoId:v,
          host:'https://www.youtube-nocookie.com',
          playerVars:{autoplay:1,controls:1,rel:0,playsinline:1,modestbranding:1,enablejsapi:1},
          events:{
            onReady:function(e){try{e.target.playVideo()}catch(x){}},
            onError:function(e){if(e.data===150||e.data===101)return;fallback()}
          }
        });
      };
      function fallback(){
        document.getElementById('player').innerHTML=
          '<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v)+
          '?autoplay=1&controls=1&rel=0&playsinline=1&modestbranding=1" '+
          'allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" '+
          'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
      }
    })();
  </script>
</body>
</html>
